name: DevOps Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the source code from GitHub onto the runner machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Configure Python on the runner computer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install application requirements and run local code checks
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    # Step 4: Verify Docker environment can compile the image recipe cleanly
    - name: Build Docker Image Test
      run: |
        docker build -t todo-api:test .

